<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#131512">
<title>Instrumental & Karaoke</title><link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.d2fed96657.css"><script src="assets/player.aee62ed8af.js" defer></script><script src="assets/app.89803a174d.js" defer></script>
</head>
<body><main class="library">
<header data-cinema-background><div class="heading"><h1>Instrumental & Karaoke</h1><span id="video-count">—</span></div><a id="playlist-link" hidden target="_blank" rel="noopener">YouTube playlist ↗</a></header>
<div class="toolbar" data-cinema-background><label class="search"><span class="sr-only">Search songs or artists</span><input id="search" type="search" placeholder="Search songs or artists" autocomplete="off"><kbd>/</kbd></label><div class="filters" aria-label="Video type"><button type="button" class="active" data-filter="all" aria-pressed="true">All</button><button type="button" data-filter="instrumental" aria-pressed="false">Instrumental</button><button type="button" data-filter="karaoke" aria-pressed="false">Karaoke</button></div></div>
<section id="player-panel" hidden aria-label="Video player"><div class="player-shell">
  <div class="player-heading"><span id="player-title"></span><div class="player-actions"><button id="theater-toggle" type="button" aria-pressed="false">Theater mode</button><button id="close-player" type="button" aria-label="Close player">Close ×</button></div></div>
  <video id="player" controls playsinline preload="metadata" tabindex="0"></video>
  <div class="transport" hidden>
    <div class="timeline"><span id="current-time">0:00</span><input id="seek" type="range" min="0" max="1" value="0" step="0.05" aria-label="Playback position"><span id="total-time">0:00</span></div>
    <div class="transport-actions"><button id="play-pause" type="button">Play</button><button id="mute" type="button" aria-pressed="false">Mute</button><input id="volume" type="range" min="0" max="1" value="0.85" step="0.05" aria-label="Volume"><label class="speed"><span class="sr-only">Playback speed</span><select id="playback-rate" aria-label="Playback speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label><button id="fullscreen-toggle" type="button">Full screen</button></div>
  </div>
  <div class="soundtracks" hidden aria-label="Audio version"><button type="button" data-audio-track="original" aria-pressed="false" aria-busy="false">Original vocals</button><button type="button" data-audio-track="karaoke" aria-pressed="true" aria-busy="false">Karaoke</button></div>
  <p id="player-status" class="player-status" role="status" aria-live="polite" hidden></p>
</div></section>
<table data-cinema-background><caption class="sr-only">Music video collection</caption><thead><tr><th class="number" scope="col">#</th><th scope="col">Song</th><th class="artist-col" scope="col">Artist</th><th scope="col">Version</th><th class="duration-col" scope="col">Length</th><th class="watch-col" scope="col"><span class="sr-only">Watch</span></th></tr></thead><tbody id="video-list"></tbody></table>
<p id="message" role="status" data-cinema-background>Loading videos…</p>
<footer data-cinema-background>A small collection of instrumental and karaoke videos.</footer>
</main></body></html>
